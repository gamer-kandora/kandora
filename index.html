<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>KANDORA — World Conquest</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

*{
box-sizing:border-box;
}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
font-family:Arial,Helvetica,sans-serif;
background:#151915;
color:#eee;
}

#map{
position:absolute;
inset:0;
background:#71828a;
}


/* =========================================================
   TOP BAR
========================================================= */

#topBar{
position:absolute;
top:0;
left:0;
right:0;
height:72px;
z-index:3000;

display:flex;
align-items:center;

background:
linear-gradient(
#353a32,
#1b201b
);

border-bottom:2px solid #090b09;

box-shadow:0 3px 15px #0009;
}

#brand{
width:250px;
height:100%;
padding:10px 15px;
border-right:1px solid #555b51;
flex-shrink:0;
}

#brandTitle{
font-size:21px;
font-weight:900;
letter-spacing:4px;
}

#brandSub{
font-size:9px;
color:#b5b8a8;
letter-spacing:2px;
margin-top:4px;
}

.resources{
display:flex;
height:100%;
flex-shrink:0;
}

.resource{
min-width:92px;
padding:11px 12px;
border-right:1px solid #4b5048;
}

.resource small{
display:block;
color:#aeb2a3;
font-size:9px;
text-transform:uppercase;
letter-spacing:1px;
}

.resource b{
display:block;
margin-top:5px;
font-size:15px;
}

#liveNews{
flex:1;
min-width:150px;
height:100%;

display:flex;
align-items:center;

overflow:hidden;

padding:0 12px;

border-left:1px solid #555b51;
border-right:1px solid #555b51;

background:
linear-gradient(
90deg,
#1b201b,
#272d26,
#1b201b
);
}

#liveNewsInner{
width:100%;
display:flex;
align-items:center;
overflow:hidden;
white-space:nowrap;
}

#liveNewsLabel{
flex-shrink:0;
margin-right:9px;
padding:4px 7px;

background:#633d35;
border:1px solid #916052;

font-size:8px;
font-weight:bold;
letter-spacing:1px;
}

#liveNewsText{
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
font-size:11px;
color:#ddd;
}

#liveNewsText.flash{
animation:newsFlash .45s ease;
}

@keyframes newsFlash{

0%{
opacity:.15;
transform:translateX(10px);
}

100%{
opacity:1;
transform:translateX(0);
}

}

#dateBox{
text-align:center;
padding:10px 16px;
border-left:1px solid #555b51;
flex-shrink:0;
}

#date{
font-weight:bold;
font-size:16px;
}

#dateBox small{
font-size:9px;
}

#speedBox{
display:flex;
gap:4px;
padding:0 9px;
flex-shrink:0;
}

.speed{
width:38px;
height:35px;

background:#30362f;
color:#eee;

border:1px solid #666d61;

cursor:pointer;
font-weight:bold;
}

.speed:hover,
.speed.active{
background:#77704d;
border-color:#c4b66e;
}


/* =========================================================
   PANELS
========================================================= */

.panel{
background:
linear-gradient(
#30362f,
#171c17
);

border:1px solid #77765e;

box-shadow:0 6px 20px #0009;
}

.panelHead{
padding:10px 12px;

background:#3a4038;

border-bottom:1px solid #77765e;

font-size:12px;
font-weight:bold;
letter-spacing:1px;
}

#countryPanel{
position:absolute;
z-index:2000;
left:12px;
top:85px;
width:250px;
}

#countryContent{
padding:12px;
}

#countryName{
font-size:19px;
font-weight:bold;
}

.muted{
color:#afb2a5;
font-size:11px;
margin-top:4px;
}

.stat{
margin-top:12px;
}

.statTop{
display:flex;
justify-content:space-between;
font-size:10px;
color:#c4c7bc;
}

.bar{
height:7px;
background:#101310;
border:1px solid #4c514a;
margin-top:4px;
}

.fill{
height:100%;
background:#74894f;
width:60%;
}

#worldPanel{
position:absolute;
z-index:2000;
right:12px;
top:85px;
width:240px;
}

.info{
display:flex;
justify-content:space-between;
padding:8px 11px;
border-bottom:1px solid #40463e;
font-size:11px;
color:#b9bdb2;
}

.info b{
color:#eee;
}


/* =========================================================
   ARMY PANEL
========================================================= */

#armyPanel{
position:absolute;
z-index:2200;
left:12px;
top:350px;
width:250px;
display:none;
}

#armyContent{
padding:11px;
}

.unitInfo{
padding:8px;
margin-top:6px;
background:#292f29;
border:1px solid #464d44;
font-size:11px;
display:flex;
justify-content:space-between;
}

.supplyGood{
color:#8ecb82;
}

.supplyWarn{
color:#d1b967;
}

.supplyBad{
color:#d27969;
}

#armySupplyBar{
height:7px;
margin-top:6px;
background:#101310;
border:1px solid #4c514a;
}

#armySupplyFill{
height:100%;
background:#668e59;
width:100%;
}

#stopButton{
width:100%;
margin-top:10px;
padding:8px;

background:#633d35;

color:white;

border:1px solid #916052;

cursor:pointer;
}


/* =========================================================
   PROVINCE
========================================================= */

#provinceInfo{
position:absolute;
z-index:2500;
left:50%;
bottom:80px;
transform:translateX(-50%);

width:390px;
padding:14px;

display:none;
}

#provinceInfo h2{
margin:0 0 8px;
font-size:18px;
}

#provinceInfo p{
margin:5px 0;
color:#c0c3b9;
font-size:11px;
}


/* =========================================================
   BUTTONS
========================================================= */

.button{
padding:9px 12px;

background:
linear-gradient(
#5d6556,
#363c34
);

border:1px solid #7b816f;

color:white;

font-weight:bold;

cursor:pointer;

font-size:10px;
}

.button:hover{
background:#6e7663;
}

.button.red{
background:
linear-gradient(
#7a493e,
#4c2b26
);

border-color:#a26859;
}

.button.blue{
background:
linear-gradient(
#53697a,
#303f4b
);

border-color:#7c95a6;
}

.button.gold{
background:
linear-gradient(
#756b43,
#4d462d
);

border-color:#aa9a5b;
}

.button.green{
background:
linear-gradient(
#547247,
#30452a
);

border-color:#7ea06d;
}

.button:disabled{
opacity:.45;
cursor:not-allowed;
}

#attackButton{
width:100%;
margin-top:9px;
}


/* =========================================================
   BOTTOM
========================================================= */

#bottomBar{
position:absolute;
z-index:3000;
bottom:0;
left:0;
width:100%;
height:64px;

display:flex;
align-items:center;
gap:7px;
padding:8px 12px;

background:
linear-gradient(
#343a32,
#171c17
);

border-top:2px solid #090b09;
}

.command{
min-width:105px;
height:42px;
}

#newGame{
margin-left:auto;
}


/* =========================================================
   ARMY COUNTERS
========================================================= */

.unit-counter{
width:78px;
height:44px;

padding:2px;

cursor:pointer;

color:white;

font-size:8px;

border:1px solid;

box-shadow:0 2px 6px #000c;

overflow:visible;
position:relative;
transform-origin:center;
}

.unit-counter .unit-flag{
position:absolute;
top:-10px;
left:3px;
font-size:12px;
line-height:12px;
text-shadow:0 1px 2px #000;
z-index:3;
}

.unit-counter .stack-badge{
position:absolute;
top:-9px;
right:-7px;
min-width:15px;
height:15px;
padding:0 3px;
border-radius:8px;
background:#151915;
border:1px solid #ddd6a4;
color:#fff;
font-size:8px;
font-weight:900;
line-height:13px;
text-align:center;
z-index:4;
}

.player-army{
background:
linear-gradient(
#3f6b45,
#18351e
);

border-color:#9acb9b;
}

.ally-army{
background:
linear-gradient(
#416f9f,
#1e3c63
);

border-color:#9bc5ee;
}

.ai-army{
background:
linear-gradient(
#633f3b,
#241512
);

border-color:#c28a80;
}

.unit-counter.selected{
border-color:#e5cb64;

box-shadow:
0 0 0 1px #e5cb6466,
0 2px 7px #000;
}

.unit-country{
display:block;

width:100%;

font-size:7px;

font-weight:900;

letter-spacing:.6px;

color:#f4f3df;

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

margin-bottom:1px;
}

.unit-top{
display:flex;
align-items:center;
height:20px;
}

.unit-symbol{
width:19px;
height:18px;
margin-right:2px;
}

.unit-symbol svg{
width:19px;
height:18px;
}

.unit-numbers{
font-size:7px;
line-height:8px;
font-weight:bold;
}

.unit-total{
margin-left:auto;
font-size:9px;
color:#e5d99b;
}

.unit-bar{
height:5px;
background:#0d110d;
border:1px solid #50574e;
margin-top:2px;
}

.unit-org{
height:100%;
background:#6e9852;
}


/* =========================================================
   CAPITAL STARS
========================================================= */

.capital-star{
color:#ffd84a;

font-size:22px;

font-weight:900;

text-align:center;

line-height:22px;

text-shadow:
0 0 3px #000,
0 0 6px #000;

pointer-events:none;
}


/* =========================================================
   BATTLES
========================================================= */

.battle-indicator-wrap{
width:130px;
height:45px;

position:relative;

pointer-events:none;
}

.battle-indicator{
width:34px;
height:34px;

border-radius:50%;

background:#35a84c;

border:3px solid #e7f0df;

box-shadow:
0 0 0 2px #172017,
0 3px 10px #000b;

display:flex;

align-items:center;

justify-content:center;

color:white;

font-size:18px;

font-weight:900;
}

.battle-label{
position:absolute;

left:40px;

top:8px;

white-space:nowrap;

background:#202620ee;

border:1px solid #777b68;

padding:3px 6px;

font-size:8px;

font-weight:bold;
}


/* =========================================================
   CITIES
========================================================= */

#cityWindow{
position:absolute;

z-index:6500;

top:95px;

right:280px;

width:365px;

max-width:90vw;

max-height:80vh;

overflow:auto;

display:none;
}

#cityContent{
padding:14px;
}

.cityStat{
padding:8px;

margin-bottom:7px;

background:#252b25;

border:1px solid #454c43;

font-size:11px;
}

.cityBuildGrid{

display:grid;

grid-template-columns:
1fr 1fr;

gap:8px;

margin-top:10px;
}

.cityBuild{

padding:9px;

background:#292f29;

border:1px solid #4b5349;
}

.cityBuild b{

display:block;

margin-bottom:4px;

font-size:11px;
}

.cityBuild span{

color:#aeb2a5;

font-size:10px;
}

.cityConstruction{

margin-top:10px;

padding:9px;

background:#202520;

border:1px solid #454b43;
}

.cityMarker{

text-align:center;

font-weight:900;

text-shadow:
0 1px 3px #000,
0 0 5px #000;

pointer-events:none;
}

.cityCapital{

color:#ffd84a;

font-size:20px;
}

.cityMajor{

color:#f0df89;

font-size:17px;
}

.cityNormal{

color:#e7e7d0;

font-size:13px;
}


/* =========================================================
   NEWS
========================================================= */

#newsButton{

position:absolute;

z-index:3500;

right:260px;

top:85px;
}

#newsWindow{

position:absolute;

z-index:7000;

top:95px;

right:25px;

width:400px;

max-width:90vw;

max-height:76vh;

display:none;

overflow:auto;
}

#newsContent{

padding:10px;
}

.newsItem{

padding:10px;

margin-bottom:7px;

background:#252b25;

border:1px solid #474e45;

font-size:11px;

line-height:1.4;
}

.newsTime{

color:#c8bd78;

font-size:9px;

margin-bottom:4px;

font-weight:bold;
}

.newsWar{

border-left:4px solid #a85b50;
}

.newsPeace{

border-left:4px solid #708c62;
}

.newsAlliance{

border-left:4px solid #557ba0;
}

.newsBattle{

border-left:4px solid #ad9a55;
}

.newsCapture{

border-left:4px solid #698f61;
}

.newsSurrender{

border-left:4px solid #b8a756;
}

.newsAI{

border-left:4px solid #8c6b9c;
}


/* =========================================================
   WINDOWS
========================================================= */

#focusWindow,
#researchWindow,
#recruitWindow,
